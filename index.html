<script>
const tariffs = {
EEDC: { A: 225, B: 68, C: 56, D: 40, E: 35 },
IKEDC: { A: 225, B: 65, C: 55, D: 40, E: 35 },
EKEDC: { A: 225, B: 66, C: 56, D: 40, E: 35 },
AEDC: { A: 225, B: 63, C: 54, D: 39, E: 34 },
PHED: { A: 225, B: 61, C: 53, D: 38, E: 34 },
IBEDC: { A: 225, B: 62, C: 54, D: 39, E: 34 },
KEDCO: { A: 225, B: 60, C: 52, D: 38, E: 33 },
JED: { A: 225, B: 60, C: 52, D: 38, E: 33 },
KAEDCO: { A: 225, B: 60, C: 52, D: 38, E: 33 },
BEDC: { A: 225, B: 62, C: 54, D: 39, E: 34 },
YEDC: { A: 225, B: 59, C: 51, D: 37, E: 33 }
};

const bandHours = {
A: "20+ hours",
B: "16-20 hours",
C: "12-16 hours",
D: "8-12 hours",
E: "4-8 hours"
};

function updateBands() {
const company = document.getElementById("discoCompany").value;
const bandSelect = document.getElementById("disco");

bandSelect.innerHTML = "";

for (const band in tariffs[company]) {
const option = document.createElement("option");

// ✅ FIXED: correct value
option.value = tariffs[company][band];

// ✅ FIXED: correct text
option.text = `Band ${band} - ₦${tariffs[company][band]}/kWh | ${bandHours[band]} daily`;

bandSelect.appendChild(option);
}
}

function calcUnits() {
const rate = parseFloat(document.getElementById("disco").value);
const amount = parseFloat(document.getElementById("amount").value);
const resultDiv = document.getElementById("result");

const companyText = document.getElementById("discoCompany")
.options[document.getElementById("discoCompany").selectedIndex].text;

if (!amount || amount < 100) {
alert("Please enter amount from ₦100 and above");
return;
}

if (!rate) {
alert("Please select a band");
return;
}

const units = (amount / 1.075 / rate).toFixed(2);

resultDiv.style.display = "block";
resultDiv.innerHTML = `
For <strong>${companyText}</strong><br>
You will get approximately <strong>${units} units/kWh</strong>
`;
}

// Load default
window.onload = updateBands;
</script>
